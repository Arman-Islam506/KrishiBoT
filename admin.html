<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KrishiBoT – Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="admin-body">

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="brand-box">
            <img src="assets/botlogo.png" alt="KrishiBoT logo" class="brand-logo">
            <div>
                <div class="brand-text-main">KrishiBoT Admin Panel</div>
                <div class="brand-text-sub">Manage crops, farmers & system data</div>
            </div>
        </div>

        <div class="top-right">
            <a href="#" class="nav-link" id="adminLogoutLink">Logout</a>
        </div>
    </div>

    <!-- ADMIN CONTENT -->
    <div class="admin-wrapper">

        <!-- METRIC CARDS -->
        <div class="admin-grid">

            <div class="admin-card">
                <div class="admin-card-title">Total Crops</div>
                <div class="admin-card-value" id="stat-crops">0</div>
                <div class="admin-card-sub">Crops in database</div>
            </div>

            <div class="admin-card">
                <div class="admin-card-title">Registered Farmers</div>
                <div class="admin-card-value" id="stat-farmers">0</div>
                <div class="admin-card-sub">Number of users</div>
            </div>

            <div class="admin-card">
                <div class="admin-card-title">Chats Today</div>
                <div class="admin-card-value" id="stat-chats-today">0</div>
                <div class="admin-card-sub">Active queries</div>
            </div>

            <div class="admin-card">
                <div class="admin-card-title">Avg. Response Time</div>
                <div class="admin-card-value" id="stat-response">–</div>
                <div class="admin-card-sub">Last 24 hours</div>
            </div>

        </div>

        <!-- 2 COLUMN LAYOUT -->
        <div class="admin-two-col">

            <!-- CROP DATABASE TABLE -->
            <div class="admin-table-card">
                <div class="admin-table-title">Crop Database</div>

                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Crop</th>
                            <th>Season</th>
                            <th>Soil</th>
                        </tr>
                    </thead>

                    <!-- Dynamic crop list -->
                    <tbody id="crop-table"></tbody>
                </table>

                <button class="btn-outline" style="margin-top:10px;" onclick="window.location='backend/backup.php'">
                    Download Backup
                </button>
            </div>

            <!-- RECENT CHATS -->
            <div class="admin-table-card">
                <div class="admin-table-title">Recent Chats</div>

                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Query</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <!-- Dynamic recent chat list -->
                    <tbody id="recent-chat-table"></tbody>
                </table>

            </div>

        </div>
    </div>

    <script src="script.js"></script>

    <!-- Admin Dashboard Dynamic JS -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const page = window.location.pathname.split("/").pop();
        if (page !== "admin.html") return;

        /* -------------------------
           1. Load Dashboard Stats
        ------------------------- */
        fetch("backend/get_stats.php")
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    document.getElementById("stat-crops").innerText        = data.stats.crops;
                    document.getElementById("stat-farmers").innerText      = data.stats.farmers;
                    document.getElementById("stat-chats-today").innerText  = data.stats.todayChats;
                    document.getElementById("stat-response").innerText     = data.stats.avgResponse + " sec";
                }
            })
            .catch(err => console.error("Stats load error:", err));


        /* -------------------------
           2. Load Crop Database
        ------------------------- */
        fetch("backend/get_crops.php")
            .then(res => res.json())
            .then(data => {
                const table = document.getElementById("crop-table");
                if (!table) return;
                table.innerHTML = ""; // clear

                if (data.status === "success") {
                    data.crops.forEach(row => {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${row.crop_name}</td>
                            <td>${row.season}</td>
                            <td>${row.soil_type}</td>
                        `;
                        table.appendChild(tr);
                    });
                }
            })
            .catch(err => console.error("Crop table error:", err));


        /* -------------------------
           3. Load Recent Chats
        ------------------------- */
        fetch("backend/get_recent_chats.php")
            .then(res => res.json())
            .then(data => {
                const table = document.getElementById("recent-chat-table");
                if (!table) return;
                table.innerHTML = "";

                if (data.status === "success") {
                    data.chats.forEach(chat => {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${chat.user}</td>
                            <td>${chat.query}</td>
                            <td>${chat.date}</td>
                        `;
                        table.appendChild(tr);
                    });
                }
            })
            .catch(err => console.error("Recent chats error:", err));

    });
    </script>

</body>
</html>
